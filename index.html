<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Sound Delay - B站直播声音延时</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<style>
  #player-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  #player-box video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .delay-btn { min-width: 6.5rem; }
  #timer-display { font-variant-numeric: tabular-nums; font-size: 1.6rem; }
  #audio-status { font-size: .85rem; }
</style>
</head>
<body class="bg-dark text-light">
<div class="container py-4">

  <h3 class="mb-3">B站直播声音延时器</h3>

  <!-- 直播间 ID -->
  <div class="row g-2 align-items-center mb-3">
    <div class="col-auto">
      <label for="room-input" class="col-form-label">直播间 ID:</label>
    </div>
    <div class="col-auto">
      <input type="text" class="form-control" id="room-input" value="8178490">
    </div>
    <div class="col-auto">
      <button class="btn btn-primary" id="btn-load-room">加载直播间</button>
    </div>
  </div>

  <!-- 播放器 -->
  <div id="player-box" class="mb-3 rounded overflow-hidden">
    <video id="live-video" controls autoplay playsinline></video>
    <div id="player-loading" class="position-absolute top-50 start-50 translate-middle text-secondary">
      点击“加载直播间”开始播放
    </div>
  </div>

  <!-- 延时控制 -->
  <div class="card bg-secondary bg-opacity-10 border-secondary mb-3">
    <div class="card-body">
      <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <span class="me-2">调整延时:</span>
        <button class="btn btn-outline-light delay-btn" data-delta="-5">-5s</button>
        <button class="btn btn-outline-light delay-btn" data-delta="-1">-1s</button>
        <button class="btn btn-outline-light delay-btn" data-delta="-0.5">-0.5s</button>
        <button class="btn btn-outline-light delay-btn" data-delta="-0.1">-0.1s</button>
        <span class="fs-4 fw-bold px-2" id="delay-display">0.0s</span>
        <button class="btn btn-outline-light delay-btn" data-delta="0.1">+0.1s</button>
        <button class="btn btn-outline-light delay-btn" data-delta="0.5">+0.5s</button>
        <button class="btn btn-outline-light delay-btn" data-delta="1">+1s</button>
        <button class="btn btn-outline-light delay-btn" data-delta="5">+5s</button>
      </div>

      <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <input type="number" class="form-control" id="manual-delay" style="max-width:10rem"
               step="0.1" min="0" placeholder="手动输入秒数">
        <button class="btn btn-success" id="btn-apply-delay">应用延时</button>

        <button class="btn btn-warning" id="btn-measure">测量延时</button>
        <span id="timer-display" class="fw-bold">0.0s</span>
      </div>

      <div class="d-flex flex-wrap align-items-center gap-3">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="delay-switch">
          <label class="form-check-label" for="delay-switch">启用延时</label>
        </div>
        <span id="audio-status" class="text-secondary"></span>
        <button class="btn btn-outline-secondary btn-sm" id="btn-resume-audio">恢复音频(浏览器自动播放策略)</button>
      </div>
    </div>
  </div>

  <p class="text-secondary small">
    说明:启用延时会静音内嵌播放器,改用单独拉取的直播流播放延后音频(需浏览器允许音频自动播放,
    若无声请点击"恢复音频")。测量延时:按下开始计时,听到/看到目标事件后再按一次结束,
    计时结果会自动设为当前延时并启动延时。
  </p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const roomInput = $('room-input');
  const playerLoading = $('player-loading');
  const delayDisplay = $('delay-display');
  const audioStatus = $('audio-status');
  const timerDisplay = $('timer-display');

  let delaySeconds = 0;          // 当前延时(秒)
  let delayEnabled = false;
  let flvPlayer = null;
  let audioCtx = null, delayNode = null, srcNode = null, mediaEl = null;

  // ---------- 播放器 ----------
  function loadRoom() {
    const id = roomInput.value.trim();
    if (!/^\d+$/.test(id)) { alert('请输入有效的直播间 ID(纯数字)'); return; }
    stopAudioPipeline();
    startAudioPipeline().catch(e => setStatus('播放错误: ' + e.message, true));
  }
  $('btn-load-room').addEventListener('click', loadRoom);
  roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadRoom(); });

  // ---------- 延时显示 ----------
  function renderDelay() {
    delayDisplay.textContent = delaySeconds.toFixed(1) + 's';
    if (delayNode) delayNode.delayTime.setTargetAtTime(Math.max(delaySeconds, 0), audioCtx.currentTime, 0.05);
  }

  document.querySelectorAll('.delay-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      delaySeconds = Math.max(0, delaySeconds + parseFloat(btn.dataset.delta));
      renderDelay();
    });
  });

  $('btn-apply-delay').addEventListener('click', () => {
    const v = parseFloat($('manual-delay').value);
    if (isNaN(v) || v < 0) { alert('请输入不小于 0 的秒数'); return; }
    delaySeconds = v;
    renderDelay();
  });

  // ---------- 启用开关 ----------
  $('delay-switch').addEventListener('change', async e => {
    delayEnabled = e.target.checked;
    if (delayEnabled) {
      if (!flvPlayer) await startAudioPipeline();
      renderDelay();
    } else {
      if (delayNode) delayNode.delayTime.setTargetAtTime(0, audioCtx.currentTime, 0.05);
      setStatus('延时已关闭,播放实时声音');
    }
  });

  // 浏览器自动播放策略:用户手势后才能出声
  $('btn-resume-audio').addEventListener('click', async () => {
    if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
    if (mediaEl) { try { await mediaEl.play(); } catch (_) {} }
    updateAudioStatus();
  });

  function setStatus(msg, isErr) {
    audioStatus.textContent = msg;
    audioStatus.className = isErr ? 'text-danger' : 'text-info';
  }
  function updateAudioStatus() {
    if (!delayEnabled) { setStatus(''); return; }
    if (audioCtx && audioCtx.state === 'suspended') setStatus('音频被浏览器暂停,请点击"恢复音频"', true);
    else if (mediaEl && !mediaEl.paused) setStatus('延时音频播放中');
    else setStatus('音频未播放', true);
  }

  // ---------- 音频管线:flv.js 拉流 -> <video>(隐藏) -> Web Audio DelayNode ----------
  async function startAudioPipeline() {
    if (!flvjs.isSupported()) throw new Error('浏览器不支持 flv.js (需要 MSE)');
    if (flvPlayer) return;

    const roomId = roomInput.value.trim();
    const streamUrl = await getLiveStreamUrl(roomId);
    if (!streamUrl) throw new Error('无法获取直播流地址(可能未开播或接口受限)');

    mediaEl = $('live-video');
    playerLoading.classList.add('d-none');
    mediaEl.muted = false;
    mediaEl.volume = 1;

    flvPlayer = flvjs.createPlayer({
      type: 'flv',
      url: streamUrl,
      isLive: true,
      cors: true,
    }, {
      enableStashBuffer: false,
      liveBufferLatencyChasing: true,
    });
    flvPlayer.attachMediaElement(mediaEl);
    flvPlayer.load();

    await new Promise((res, rej) => {
      flvPlayer.on(flvjs.Events.MEDIA_INFO, res);
      flvPlayer.on(flvjs.Events.ERROR, (_, et, ed) => rej(new Error(`${et}: ${ed}`)));
      setTimeout(() => rej(new Error('拉流超时')), 15000);
    });
    await mediaEl.play();

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    srcNode = audioCtx.createMediaElementSource(mediaEl);
    delayNode = audioCtx.createDelay(7200); // 最大 2 小时
    delayNode.delayTime.value = Math.max(delaySeconds, 0);
    srcNode.connect(delayNode);
    delayNode.connect(audioCtx.destination);
    if (audioCtx.state === 'suspended') setStatus('音频被浏览器暂停,请点击"恢复音频"', true);
    else setStatus('延时音频播放中');

    // 定时检查音频状态
    clearInterval(startAudioPipeline._timer);
    startAudioPipeline._timer = setInterval(updateAudioStatus, 2000);
  }

  function stopAudioPipeline() {
    clearInterval(startAudioPipeline._timer);
    try { if (flvPlayer) { flvPlayer.pause(); flvPlayer.unload(); flvPlayer.detachMediaElement(); flvPlayer.destroy(); } } catch (_) {}
    try { if (srcNode) srcNode.disconnect(); } catch (_) {}
    try { if (delayNode) delayNode.disconnect(); } catch (_) {}
    try { if (audioCtx) audioCtx.close(); } catch (_) {}
    if (mediaEl) { mediaEl.removeAttribute('src'); mediaEl.load(); }
    flvPlayer = srcNode = delayNode = audioCtx = null;
    setStatus('');
  }

  // 通过 B 站接口解析真实房间号并取流地址,经本地代理 /stream 转发以绕过 CORS
  async function getLiveStreamUrl(roomId) {
    // 1) 短号 -> 真实房间号
    let realId = roomId;
    try {
      const r = await fetch(`/api/room-init?id=${roomId}`);
      const j = await r.json();
      if (j.code === 0 && j.data && j.data.room_id) realId = j.data.room_id;
    } catch (_) {}

    // 2) 取播放地址(新接口,返回多协议流;优先 FLV+AVC,flv.js 兼容性最好)
    const r2 = await fetch(`/api/play-info?room_id=${realId}&protocol=0,1&format=0,1,2&codec=0,1`);
    const j2 = await r2.json();
    if (j2.code !== 0) throw new Error(j2.message || '获取播放信息失败');

    let flvUrl = null;
    try {
      const streams = j2.data.playurl_info.playurl.stream;
      for (const s of streams) {
        if (s.protocol_name !== 'http_stream') continue;
        for (const f of s.format) {
          if (f.format_name !== 'flv') continue;
          for (const c of f.codec) {
            if (c.codec_name !== 'avc') continue; // flv.js 不支持 HEVC in FLV
            const u = c.url_info[0];
            flvUrl = u.host + c.base_url + u.extra;
            break;
          }
          if (flvUrl) break;
        }
        if (flvUrl) break;
      }
    } catch (_) {}
    if (!flvUrl) throw new Error('未开播或无可用 FLV 流');
    return '/stream?url=' + encodeURIComponent(flvUrl);
  }

  // ---------- 测量延时 ----------
  let measureStart = null, measureTimer = null;
  $('btn-measure').addEventListener('click', () => {
    if (measureStart === null) {
      measureStart = performance.now();
      $('btn-measure').textContent = '结束计时';
      $('btn-measure').classList.replace('btn-warning', 'btn-danger');
      measureTimer = setInterval(() => {
        timerDisplay.textContent = ((performance.now() - measureStart) / 1000).toFixed(1) + 's';
      }, 100);
    } else {
      const measured = (performance.now() - measureStart) / 1000;
      clearInterval(measureTimer);
      measureStart = null;
      $('btn-measure').textContent = '测量延时';
      $('btn-measure').classList.replace('btn-danger', 'btn-warning');
      delaySeconds = Math.round(measured * 10) / 10;
      renderDelay();
      if (!delayEnabled) { $('delay-switch').checked = true; $('delay-switch').dispatchEvent(new Event('change')); }
    }
  });

  renderDelay();
})();
</script>
</body>
</html>
