<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title> B站直播音频延时神器 </title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:#161b22;color:#e8edf2;font:14px/1.4 system-ui,sans-serif}body{padding:8px 12px;border-bottom:1px solid #48515b}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.group{display:flex;gap:5px;align-items:center}.title{font-weight:700;white-space:nowrap}button,input{border:1px solid #59636d;border-radius:6px;color:#edf2f7;background:#28313a;padding:5px 8px}button{cursor:pointer;white-space:nowrap}button:hover{background:#3b4854}.primary{background:#1677d2;border-color:#2489e5}.danger{background:#a93636;border-color:#d45555}.current{width:78px;text-align:center;font-weight:700}.applied{color:#9fb1c2;white-space:nowrap}.status{color:#9fb1c2;font-size:12px;flex:1;min-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.popup-backdrop{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:10}.popup{background:#222b35;border:1px solid #59636d;border-radius:10px;padding:18px;width:min(430px,90vw);box-shadow:0 10px 35px #0009}.popup h3{margin:0 0 12px}.popup input{width:100%;margin:8px 0}.popup .actions{display:flex;justify-content:flex-end;gap:8px}@media(max-width:900px){.status{min-width:100px}}
</style>
</head>
<body>
<div class="toolbar">
  <span class="title">B站直播音频延时神器</span>
  <div class="group"><button id="test" class="primary">打开测试页</button><button id="sage">打开悲怆先知</button><button id="custom">打开自选直播</button></div>
  <div class="group"><button data-delta="-5">−5s</button><button data-delta="-1">−1s</button><button data-delta="-0.5">−0.5s</button><button data-delta="-0.1">−0.1s</button><input id="delay" class="current" type="text" value="0.0" aria-label="当前延时输入"><button data-delta="0.1">+0.1s</button><button data-delta="0.5">+0.5s</button><button data-delta="1">+1s</button><button data-delta="5">+5s</button></div>
  <div class="group"><button id="apply">应用延时</button><span class="applied">已应用: <b id="applied">0.0s</b></span></div>
  <div class="group"><button id="measure">测量延时</button><span id="timer">0.0s</span></div>
  <label><input id="enabled" type="checkbox"> 启用延时</label><label><input id="muted" type="checkbox"> 静音</label>
  <span id="status" class="status">正在加载…</span>
</div>
<script src="toolbar.js"></script>
</body>
</html>
